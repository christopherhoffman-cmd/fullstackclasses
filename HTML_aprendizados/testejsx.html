<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
</head>

<body>

    <div>
        <p id="minhaDiv">Hello, World!</p>

        <p id="mensagem">Esta é a minha mensagem.</p>

        <hr>

        <h3>Calculadora de Notas</h3>

        <label for="nomeAluno">Nome: </label>
        <input type="text" id="nomeAluno">
        <br><br>

        <label for="nota1">Nota 1: </label>
        <input type="number" id="nota1">
        <br><br>

        <label for="nota2">Nota 2: </label>
        <input type="number" id="nota2">
        <br><br>

        <button onclick="calcularMediaFormulario()">
            Calcular Média
        </button>

        <p id="resultadoMedia" style="font-weight: bold; color: blue;"></p>
    </div>

    
    <p id="resultadoDobro" style="font-weight: bold; color: green;"></p>

    <p id="resultadoSoma" style="font-weight: bold; color: red;"></p>

    <label for="nome">Digite o seu nome:</label>
    <input type="text" id="nome">
    <button onclick="receberNome()">Enviar</button>

    <p id="resultadoNome" style="font-weight: bold; color: purple;"></p>

    <script src="script.js"></script>

</body>
</html>
